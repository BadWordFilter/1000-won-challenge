<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천원 챌린지 유형 테스트 | 멋진실패 빛나는성공</title>
    <meta name="description" content="교수님께 받은 천원으로 나의 가치를 만들어보는 시간. 나의 천원 챌린지 유형을 확인해보세요!">
    <meta name="keywords" content="천원챌린지, 유형테스트, 심리테스트, 자기계발, 멋진실패">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://badwordfilter.github.io/1000-won-challenge/">
    <meta property="og:title" content="천원 챌린지 유형 테스트">
    <meta property="og:description" content="나의 천원 챌린지 유형은? 지금 바로 확인해보세요!">
    <meta property="og:image" content="images/og-image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="천원 챌린지 유형 테스트">
    <meta property="twitter:description" content="나의 천원 챌린지 유형은? 지금 바로 확인해보세요!">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Outfit:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Game Font (DungGeunMo) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- GAME STATUS BAR -->
        <div class="game-status-bar hidden" id="status-bar">
            <div class="stat-sidebar">
                <div class="mini-stat">
                    <span class="label">LVL</span>
                    <span class="value" id="lvl-val">01</span>
                </div>
                <div class="mini-stat">
                    <span class="label">GOLD</span>
                    <span class="value" id="gold-val">1,000₩</span>
                </div>
            </div>

            <div class="class-gauges">
                <div class="gauge-item" data-class="MAKER">
                    <span class="gauge-label">MKR</span>
                    <div class="gauge-bar">
                        <div class="gauge-fill" id="gauge-MAKER"></div>
                    </div>
                </div>
                <div class="gauge-item" data-class="EXPLORER">
                    <span class="gauge-label">EXP</span>
                    <div class="gauge-bar">
                        <div class="gauge-fill" id="gauge-EXPLORER"></div>
                    </div>
                </div>
                <div class="gauge-item" data-class="SAVER">
                    <span class="gauge-label">SVR</span>
                    <div class="gauge-bar">
                        <div class="gauge-fill" id="gauge-SAVER"></div>
                    </div>
                </div>
                <div class="gauge-item" data-class="OBSERVER">
                    <span class="gauge-label">OBS</span>
                    <div class="gauge-bar">
                        <div class="gauge-fill" id="gauge-OBSERVER"></div>
                    </div>
                </div>
                <div class="gauge-item" data-class="TRADER">
                    <span class="gauge-label">TRD</span>
                    <div class="gauge-bar">
                        <div class="gauge-fill" id="gauge-TRADER"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- HEADER (TITLE SCREEN) -->
        <header class="app-header" id="main-header">
            <h1 class="game-title">멋진실패 <span class="highlight">빛나는성공</span></h1>
            <p class="subtitle">PRESS START TO DISCOVER YOUR TYPE</p>
        </header>

        <!-- INTRO PAGE -->
        <section id="intro-page" class="page active">
            <div class="card glass-card">
                <img src="images/won_bill.svg" alt="1000 Won" class="intro-img">
                <h2 class="intro-title">천원 챌린지란?</h2>
                <p class="intro-desc">교수님께 받은 천원으로<br>나만의 가치를 만들어보는 시간.</p>
                <div class="input-group">
                    <label for="username">이름</label>
                    <input type="text" id="username" placeholder="이름을 입력하세요">
                </div>
                <div class="input-group">
                    <label for="major">학과</label>
                    <input type="text" id="major" placeholder="학과를 입력하세요">
                </div>
                <button id="start-btn" class="btn primary-btn">테스트 시작하기</button>
            </div>
        </section>

        <!-- QUESTION PAGE -->
        <section id="question-page" class="page hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="card glass-card">
                <div id="quest-sprite-box" class="sprite-container"></div>
                <div class="question-number">QUEST <span id="q-num">1</span></div>
                <h3 id="question-text">질문 내용이 여기에 나옵니다.</h3>
                <div class="options-container" id="options-container">
                    <!-- Options injected via JS -->
                </div>
            </div>
        </section>

        <!-- RESULT PAGE -->
        <section id="result-page" class="page hidden">
            <div class="card glass-card result-card" id="result-capture-area">
                <div class="result-header">
                    <span id="result-name" class="user-name">OOO</span>님의 유형은
                </div>
                <h2 id="result-title" class="result-title">유형 이름</h2>
                <div class="result-badge">
                    <div class="badge-icon">✨</div>
                </div>
                <p id="result-desc" class="result-desc">유형 설명이 들어갑니다.</p>

                <div class="recommendation-box">
                    <h4>추천 활동</h4>
                    <p id="result-activity">추천 활동 내용</p>
                </div>

                <p id="encouraging-msg" class="encouraging-msg"></p>

                <div class="result-footer">
                    <p>멋진실패 빛나는성공 - 천원 챌린지</p>
                </div>
            </div>

            <div class="action-buttons">
                <button id="copy-btn" class="btn primary-btn">결과 복사하기</button>
                <!-- Removed save-btn -->
                <button id="retry-btn" class="btn text-btn">다시하기</button>
            </div>
        </section>
    </div>

    <!-- Scripts -->

    <script src="js/main.js"></script>
</body>

</html>
